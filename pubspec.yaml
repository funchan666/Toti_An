name: toti_an
description: Toti for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  in_app_purchase: ^3.3.0
  video_player: ^2.11.1
  image_picker: ^1.2.2
  camera: ^0.11.4
  record: ^6.1.2
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  path_provider: ^2.1.5
  webview_flutter: ^4.14.0
  supabase_flutter: ^2.18.3
  mime: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/portraits/
    - assets/portraits/reel-stills/
    - assets/portraits/room-stills/
    - assets/portraits/moment-stills/
    - assets/videos/
    - assets/art/
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Variable.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
